<script>
  /* Theme first (no flash), then hide animated elements only when motion is allowed. A timer always reveals them. */
  (function () {
    var root = document.documentElement, t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    root.dataset.theme = t === 'light' ? 'light' : 'dark';
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) root.classList.remove('anim-pending');
    setTimeout(function () { root.classList.remove('anim-pending'); }, 2500);
  })();
</script>
<style>
  :root, [data-theme="dark"] {
    --bg: #131312; --bg-raised: #1a1a18; --surface: #1f1f1d; --text: #ece8e0; --muted: #9c978d;
    --faint: #6f6b63; --line: #2c2b28; --accent: #d4a557; --accent-ink: #17140e;
    --header-glass: rgba(19,19,18,.86); --card-shadow: 0 1px 2px rgba(0,0,0,.4);
    --card-lift: 0 18px 40px rgba(0,0,0,.55); color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: #ebe7df; --bg-raised: #e3ded4; --surface: #f3f0ea; --text: #1e1d1a; --muted: #6b665c;
    --faint: #8e897f; --line: #d3cdc1; --accent: #8a5b1d; --accent-ink: #fbf7ef;
    --header-glass: rgba(235,231,223,.88); --card-shadow: 0 1px 2px rgba(40,30,10,.08);
    --card-lift: 0 18px 40px rgba(40,30,10,.18); color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0; background: var(--bg); color: var(--text); line-height: 1.55;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; transition: background-color .3s ease, color .3s ease;
  }
  a { color: inherit; }
  .wrap { width: 100%; max-width: 1360px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left)); padding-right: max(24px, env(safe-area-inset-right)); }
  @media (max-width: 600px) { .wrap { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); } }
  .eyebrow { margin: 0; font-size: .74rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .anim-pending .hero-content, .anim-pending #work-body { opacity: 0; }

  /* ---- Hero ---- */
  header.hero { position: relative; overflow: hidden; background: radial-gradient(120% 90% at 85% 0%, var(--bg-raised), var(--bg) 70%); border-bottom: 1px solid var(--line); }
  #bg3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; opacity: 0; transition: opacity 1.4s ease; }
  #bg3d.on { opacity: 1; }
  .topbar { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 22px; padding-bottom: 22px; }
  .brand { font-weight: 650; letter-spacing: -.01em; text-decoration: none; font-size: 1rem; }
  .topnav { display: flex; align-items: center; gap: 4px; }
  .topnav a { text-decoration: none; color: var(--muted); font-size: .9rem; padding: 8px 12px; border-radius: 999px; }
  .topnav a:hover { color: var(--text); }
  @media (max-width: 520px) { .topnav a.optional { display: none; } }
  .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn svg { width: 18px; height: 18px; }
  [data-theme="dark"] .i-sun, [data-theme="light"] .i-moon { display: block; }
  [data-theme="dark"] .i-moon, [data-theme="light"] .i-sun { display: none; }
  .hero-content { position: relative; padding-top: 72px; padding-bottom: 88px; max-width: 900px; margin-left: 0; }
  @media (max-width: 600px) { .hero-content { padding-top: 40px; padding-bottom: 56px; } }
  h1 { margin: 14px 0 0; font-size: clamp(2.8rem, 8vw, 5.6rem); line-height: .98; font-weight: 700; letter-spacing: -.035em; }
  .lede { margin: 22px 0 0; max-width: 34em; font-size: clamp(1.05rem, 1.9vw, 1.3rem); color: var(--muted); line-height: 1.5; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 28px 0 0; padding: 0; list-style: none; font-size: .86rem; color: var(--faint); }
  .stats li strong { color: var(--text); font-weight: 600; }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 22px; border-radius: 999px; font: inherit; font-size: .94rem; font-weight: 600; text-decoration: none; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--text); }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }

  /* ---- Filter bar ---- */
  nav.filters { position: sticky; top: 0; z-index: 20; background: var(--header-glass); border-bottom: 1px solid var(--line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .tabs-scroll { position: relative; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0; scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity; }
  .tabs::-webkit-scrollbar { display: none; }
  @media (max-width: 900px) { .tabs-scroll::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 36px; pointer-events: none; background: linear-gradient(90deg, transparent, var(--bg)); } }
  .tab { flex: 0 0 auto; scroll-snap-align: start; font: inherit; font-size: .88rem; color: var(--muted); cursor: pointer; white-space: nowrap; min-height: 38px; padding: 0 16px; border-radius: 999px; background: transparent; border: 1px solid var(--line); }
  .tab:hover { color: var(--text); border-color: var(--faint); }
  .tab[aria-selected="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
  .tab .n { margin-left: 7px; opacity: .55; font-variant-numeric: tabular-nums; font-size: .8em; }

  /* ---- Work ---- */
  main { padding-top: 48px; padding-bottom: 96px; }
  #work, #about { scroll-margin-top: 64px; }
  @media (max-width: 600px) { main { padding-top: 32px; padding-bottom: 64px; } }
  .series-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; margin-bottom: 32px; }
  .series-head h2 { margin: 6px 0 0; font-size: clamp(1.6rem, 3.2vw, 2.3rem); letter-spacing: -.02em; line-height: 1.1; font-weight: 650; }
  .series-head p.text { margin: 10px 0 0; color: var(--muted); max-width: 40em; }
  .series-count { color: var(--faint); font-size: .86rem; font-variant-numeric: tabular-nums; }
  .grid { column-gap: 24px; columns: 1; }
  @media (min-width: 560px)  { .grid { columns: 2; } }
  @media (min-width: 1000px) { .grid { columns: 3; column-gap: 28px; } }
  @media (min-width: 1500px) { .grid { columns: 4; } }
  .card { margin: 0 0 32px; break-inside: avoid; -webkit-column-break-inside: avoid; display: inline-block; width: 100%; }
  .card-media { position: relative; display: block; width: 100%; padding: 0; border: 0; cursor: zoom-in; background: var(--surface); border-radius: 4px; overflow: hidden; box-shadow: var(--card-shadow); }
  .card-media img { display: block; width: 100%; height: auto; }
  /* Award ribbons: fair-style tabs hanging from the top edge of the photo. */
  .ribbons { position: absolute; top: 0; left: 14px; z-index: 1; display: flex; gap: 6px; pointer-events: none;
             filter: drop-shadow(0 3px 5px rgba(0,0,0,.45)); }
  .ribbon { position: relative; display: flex; flex-direction: column; align-items: center; width: 52px; padding: 10px 0 22px;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%); line-height: 1; text-align: center;
            background: linear-gradient(90deg, var(--rb-dark) 0 11%, var(--rb) 11% 89%, var(--rb-dark) 89%); color: var(--rb-ink); }
  .ribbon::before { content: ""; position: absolute; top: 0; bottom: 0; left: 4px; right: 4px;
                    border-left: 1px dashed var(--rb-stitch); border-right: 1px dashed var(--rb-stitch); }
  .ribbon b { font-size: 1.12rem; font-weight: 800; letter-spacing: -.01em; }
  .ribbon i { margin-top: 5px; font-style: normal; font-size: .56rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
  .ribbon.mini { width: 38px; padding: 8px 0 16px; flex: none; }
  .ribbon.mini b { font-size: .86rem; }
  .ribbon.mini i { display: none; }
  .r-1st { --rb: #2357bd; --rb-dark: #183f8e; --rb-ink: #f6d47c; --rb-stitch: rgba(246,212,124,.65); }
  .r-2nd { --rb: #c3372c; --rb-dark: #932a21; --rb-ink: #fff4e2; --rb-stitch: rgba(255,244,226,.6); }
  .r-3rd { --rb: #f5f2eb; --rb-dark: #d6cfc1; --rb-ink: #2a2620; --rb-stitch: rgba(42,38,32,.35); }
  .r-win { --rb: #6b2f9c; --rb-dark: #4e2174; --rb-ink: #f6d47c; --rb-stitch: rgba(246,212,124,.65); }
  .r-hm  { --rb: #2f7b4c; --rb-dark: #225a37; --rb-ink: #f3efe6; --rb-stitch: rgba(243,239,230,.55); }
  @media (max-width: 600px) { .ribbon { width: 46px; padding: 9px 0 19px; } .ribbon b { font-size: 1rem; } }
  .card-cap { flex-wrap: wrap; }
  .card-awards { flex-basis: 100%; margin: 4px 0 0; padding: 0; list-style: none; font-size: .8rem; color: var(--accent); line-height: 1.45; }
  .lb-awards { margin: 18px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; }
  .lb-awards[hidden] { display: none; }
  .lb-awards li { display: flex; align-items: flex-start; gap: 12px; }
  .lb-awards .ribbon { filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  .lb-awards strong { display: block; color: #f6d47c; font-size: .92rem; }
  .lb-awards span { display: block; color: #b9b4aa; font-size: .86rem; line-height: 1.4; margin-top: 2px; }
  .card-cap { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 2px 0; }
  .card-title { font-size: .95rem; font-weight: 600; letter-spacing: -.005em; }
  .card-meta { font-size: .78rem; color: var(--faint); white-space: nowrap; }
  .empty { color: var(--muted); }

  /* ---- About ---- */
  .about { border-top: 1px solid var(--line); background: var(--bg-raised); }
  .about .wrap { display: grid; grid-template-columns: 1fr; gap: 20px 64px; padding-top: 80px; padding-bottom: 80px; }
  @media (min-width: 900px) { .about .wrap { grid-template-columns: 280px 1fr; } }
  @media (max-width: 600px) { .about .wrap { padding-top: 56px; padding-bottom: 56px; } }
  .about h2 { margin: 8px 0 0; font-size: clamp(1.6rem, 3vw, 2.2rem); letter-spacing: -.02em; font-weight: 650; }
  .about-text p { margin: 0 0 1em; font-size: 1.08rem; max-width: 38em; }
  .about-text p:first-child { color: var(--text); }
  .about-text p + p { color: var(--muted); }
  .contact-line { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 12px; }

  footer { border-top: 1px solid var(--line); padding: 28px 0 calc(36px + env(safe-area-inset-bottom)); color: var(--faint); font-size: .84rem; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--accent); }

  /* ---- Lightbox (always dark so photos read well) ---- */
  .lb { position: fixed; inset: 0; z-index: 60; color: #ece8e0; }
  .lb[hidden] { display: none; }
  .lb-backdrop { position: absolute; inset: 0; background: rgba(10,10,9,.97); }
  .lb-shell { position: relative; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
  .lb-stage { position: relative; display: flex; align-items: center; justify-content: center; padding: 64px 88px; min-height: 0; overflow: hidden; touch-action: pan-y; }
  .lb-img { display: block; max-width: 100%; max-height: calc(100vh - 128px); max-height: calc(100dvh - 128px); object-fit: contain; border-radius: 2px; box-shadow: 0 30px 80px rgba(0,0,0,.6); user-select: none; -webkit-user-drag: none; }
  .lb-info { position: relative; border-left: 1px solid #2a2926; background: #151513; padding: 88px 36px 40px; overflow-y: auto; }
  .lb-info .eyebrow { color: #d4a557; }
  .lb-title { margin: 10px 0 0; font-size: 1.7rem; line-height: 1.15; letter-spacing: -.02em; font-weight: 650; }
  .lb-desc { margin: 16px 0 0; color: #b9b4aa; font-size: 1rem; line-height: 1.6; }
  .lb-meta { margin: 28px 0 0; padding: 20px 0 0; border-top: 1px solid #2a2926; display: grid; gap: 12px; }
  .lb-meta div { display: flex; justify-content: space-between; gap: 16px; font-size: .88rem; }
  .lb-meta dt { color: #7d786f; }
  .lb-meta dd { margin: 0; text-align: right; }
  .lb-count { margin: 24px 0 0; color: #7d786f; font-size: .82rem; font-variant-numeric: tabular-nums; }
  .lb-btn { position: absolute; z-index: 3; width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255,255,255,.16); background: rgba(20,20,18,.7); color: #ece8e0; cursor: pointer; display: grid; place-items: center; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .lb-btn:hover { border-color: #d4a557; color: #d4a557; }
  .lb-btn svg { width: 20px; height: 20px; }
  .lb-close { top: max(16px, env(safe-area-inset-top)); right: 16px; }
  .lb-prev { left: 20px; top: 50%; transform: translateY(-50%); }
  .lb-next { right: 20px; top: 50%; transform: translateY(-50%); }
  @media (max-width: 900px) {
    .lb-shell { display: block; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .lb-stage { height: 68vh; height: 68dvh; padding: 56px 12px 12px; }
    .lb-img { max-height: calc(68vh - 68px); max-height: calc(68dvh - 68px); }
    .lb-info { border-left: 0; border-top: 1px solid #2a2926; padding: 24px 20px calc(40px + env(safe-area-inset-bottom)); overflow: visible; min-height: 32vh; }
    .lb-title { font-size: 1.4rem; }
    .lb-prev, .lb-next { top: auto; bottom: 16px; transform: none; width: 44px; height: 44px; }
    .lb-prev { left: 12px; } .lb-next { right: 12px; }
    .lb-close { position: fixed; }
  }
</style>

<script>
/* ---- Site settings ---------------------------------------------------- */
const SITE_NAME = "Mason Ngo";
const SITE_SUBTITLE = "Photography Portfolio";
const CONTACT_EMAIL = "masonngo70@gmail.com";
const INTRO = "Wildlife at eye level, aviation at full speed, and public life as it happens.";

      const nav = document.querySelector('nav.filters');
      if (nav.getBoundingClientRect().top <= 0) window.scrollTo({ top: $('#work').offsetTop - nav.offsetHeight });
      g.fromTo(workBody, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power1.out' });
    } });
  }

  /* ---- Lightbox ---- */
  const lb = $('#lightbox'), lbImg = $('#lb-img'), stage = $('#lb-stage'), info = $('#lb-info');
  const backdrop = lb.querySelector('.lb-backdrop');
  let index = 0, lastFocus = null, busy = false;

  function fillLightbox(i) {
    const p = visible[i];
    lbImg.src = enc(p.filename);
    lbImg.alt = p.alt;
    $('#lb-cat').textContent = p.category;
    $('#lb-title').textContent = p.title || p.category;
    const awards = $('#lb-awards');
    awards.textContent = '';
    awardsOf(p).forEach((a) => {
      const li = make('li');
      const txt = make('div');
      txt.append(make('strong', null, placeInfo(a)[2]), make('span', null, a.event || ''));
      li.append(ribbon(a, true), txt);
      awards.appendChild(li);
    });
    awards.hidden = !awardsOf(p).length;
    const desc = $('#lb-desc');
    desc.textContent = p.description || '';
    desc.hidden = !p.description;
    const date = fmtDate(p.capture_date);
    $('#lb-date').textContent = date; $('#lb-date-row').hidden = !date;
    $('#lb-camera').textContent = p.camera || ''; $('#lb-camera-row').hidden = !p.camera;
    $('#lb-count').textContent = (i + 1) + ' / ' + visible.length;
    $('#lb-shell').scrollTop = 0;
    [visible[i + 1], visible[i - 1]].forEach((n) => { if (n) new Image().src = enc(n.filename); });
  }

  function openLightbox(i) {
    if (!visible.length) return;
    index = i; lastFocus = document.activeElement;
    fillLightbox(index);
    lb.hidden = false;
    root.style.overflow = 'hidden';
    lb.querySelector('.lb-close').focus({ preventScroll: true });
    const g = gs(); if (!g) return;
    g.fromTo(backdrop, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power1.out' });
    g.fromTo(lbImg, { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'power2.out' });
    g.fromTo(info, { opacity: 0 }, { opacity: 1, duration: 0.3, delay: 0.05 });
  }

  function closeLightbox() {
    if (lb.hidden) return;
    const done = () => { lb.hidden = true; root.style.overflow = ''; busy = false;
                         if (lastFocus) lastFocus.focus({ preventScroll: true }); };
    const g = gs(); if (!g) return done();
    g.killTweensOf([lbImg, info]);
    g.to([backdrop, lbImg, info], { opacity: 0, duration: 0.2, ease: 'power1.in', onComplete: done });
  }

  function step(dir) {
    if (lb.hidden || busy || visible.length < 2) return;
    index = (index + dir + visible.length) % visible.length;
    const g = gs(); if (!g) return fillLightbox(index);
    busy = true;
    g.to(info, { opacity: 0, duration: 0.15 });
    g.to(lbImg, { x: -40 * dir, opacity: 0, duration: 0.18, ease: 'power1.in', onComplete: () => {
      fillLightbox(index);
      const show = () => {
        g.fromTo(info, { opacity: 0 }, { opacity: 1, duration: 0.3 });
        g.fromTo(lbImg, { x: 40 * dir, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.3, ease: 'power2.out', onComplete: () => { busy = false; } });
      };
      (lbImg.decode ? lbImg.decode() : Promise.resolve()).then(show, show);
    } });
  }

  lb.querySelector('.lb-close').addEventListener('click', closeLightbox);
  lb.querySelector('.lb-prev').addEventListener('click', () => step(-1));
  lb.querySelector('.lb-next').addEventListener('click', () => step(1));
  lb.addEventListener('click', (e) => {          // click outside the photo and panel closes
    if (e.target === backdrop || e.target === stage || e.target === lb) closeLightbox();
  });
  let sx = 0, sy = 0;                            // swipe left/right on phones
  stage.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  stage.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
  }, { passive: true });
  document.addEventListener('keydown', (e) => {
    if (lb.hidden) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'Tab') {                  // keep focus inside the dialog
      const f = [...lb.querySelectorAll('button')];
      const i = f.indexOf(document.activeElement);
      e.preventDefault();
      f[(i + (e.shiftKey ? f.length - 1 : 1) + f.length) % f.length].focus();
    }
  });
  addEventListener('hashchange', () => {
    const h = decodeURIComponent(location.hash.slice(1));
    if (categories.includes(h)) selectTab(h, true);
  });

  /* ---- Initial render: photos are visible even if no library loads ---- */
  const startHash = decodeURIComponent(location.hash.slice(1));
  selectTab(categories.includes(startHash) ? startHash : 'All', false);

  function intro() {
    const g = gs();
    root.classList.remove('anim-pending');
    if (!g) return;
    g.fromTo('.hero-content', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' });
    g.fromTo(workBody, { opacity: 0 }, { opacity: 1, duration: 0.4 });
    animateCards();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', intro);
  else intro();
})();
</script>

<script type="module">
/* Subtle low-poly particle field behind the header: 2 draw calls (points + lines). */
import * as THREE from 'three';

const header = document.querySelector('header.hero');
const canvas = document.getElementById('bg3d');
const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
const wideQuery = matchMedia('(min-width: 768px)');
let renderer, scene, camera, group, pointMat, lineMat, running = false, onScreen = true, mx = 0, my = 0;

const accent = () => new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#d4a557');

function init() {
  try {
    renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'low-power' });
  } catch (e) { return false; }                    // no WebGL: header stays plain
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
  camera.position.z = 14;

  const COUNT = 150, pos = new Float32Array(COUNT * 3);
  for (let i = 0; i < COUNT; i++) {
    pos[i * 3] = (Math.random() - 0.2) * 34;       // weighted to the right, away from the text
    pos[i * 3 + 1] = (Math.random() - 0.5) * 14;
    pos[i * 3 + 2] = (Math.random() - 0.5) * 8;
  }
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  pointMat = new THREE.PointsMaterial({ color: accent(), size: 0.08, transparent: true, opacity: 0.6, depthWrite: false });
  const points = new THREE.Points(pGeo, pointMat);

  const seg = [];                                  // connect near neighbours into a low-poly mesh
  for (let i = 0; i < COUNT; i++) for (let j = i + 1; j < COUNT; j++) {
    const dx = pos[i*3]-pos[j*3], dy = pos[i*3+1]-pos[j*3+1], dz = pos[i*3+2]-pos[j*3+2];
    if (dx*dx + dy*dy + dz*dz < 6.5) seg.push(pos[i*3], pos[i*3+1], pos[i*3+2], pos[j*3], pos[j*3+1], pos[j*3+2]);
  }
  const lGeo = new THREE.BufferGeometry();
  lGeo.setAttribute('position', new THREE.Float32BufferAttribute(seg, 3));
  lineMat = new THREE.LineBasicMaterial({ color: accent(), transparent: true, opacity: 0.14, depthWrite: false });
  const lines = new THREE.LineSegments(lGeo, lineMat);

  group = new THREE.Group();
  group.add(points, lines);                        // 2 draw calls total
  scene.add(group);
  addEventListener('pointermove', (e) => { mx = e.clientX / innerWidth - 0.5; my = e.clientY / innerHeight - 0.5; }, { passive: true });
  addEventListener('themechange', () => { pointMat.color = accent(); lineMat.color = accent(); });
  new ResizeObserver(() => { if (running) resize(); }).observe(header);
  return true;
}

function resize() {
  const w = header.clientWidth, h = header.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}

function frame(t) {
  group.rotation.y = t * 0.00004 + mx * 0.12;
  group.rotation.x = my * 0.06;
  renderer.render(scene, camera);
}

/* Run only on wide screens without reduced motion, while the tab is visible and the header is on screen. */
function update() {
  const allowed = wideQuery.matches && !motionQuery.matches;
  const want = allowed && !document.hidden && onScreen;
  if (want && !renderer && !init()) return;
  if (want !== running) {
    running = want;
    if (want) { resize(); renderer.setAnimationLoop(frame); }
    else if (renderer) renderer.setAnimationLoop(null);
  }
  canvas.classList.toggle('on', allowed && !!renderer);
}

new IntersectionObserver((es) => { onScreen = es[0].isIntersecting; update(); }).observe(header);
document.addEventListener('visibilitychange', update);
wideQuery.addEventListener('change', update);
motionQuery.addEventListener('change', update);
update();
</script>
